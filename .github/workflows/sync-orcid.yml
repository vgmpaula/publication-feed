name: Sync ORCID works and publish website

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"
      timezone: "Europe/Lisbon"

concurrency:
  group: publication-feed-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch public ORCID works
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: python scripts/sync_orcid.py

      - name: Commit changed publication data
        run: |
          git add docs/publications.json docs/counts.json
          if git diff --cached --quiet; then
            echo "No publication changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update publication record from ORCID"
            git push
          fi

      - name: Upload the latest website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
